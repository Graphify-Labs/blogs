name: Welcome

# Thanks a first-time contributor, the way Supabase does. It only posts a
# comment: no checkout, no code from the pull request runs.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    if: contains(fromJSON('["FIRST_TIME_CONTRIBUTOR","FIRST_TIMER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                "Thanks for your first pull request to the Graphify blog! A maintainer will review it soon.",
                "",
                "- Run `npm run check` locally; the same checks run here.",
                "- Typo fixes are welcome as they are. No issue or long description needed.",
              ].join("\n"),
            });
