name: Publish to graphify.com

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 5 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      rebuilt: ${{ steps.hook.outputs.rebuilt }}
    steps:
      - name: Rebuild graphify.com
        id: hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set. The post will not go live until an owner adds the hook from the graphify.com Vercel project (Settings, Git, Deploy Hooks, name it blog)."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$HOOK"
          echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          echo "graphify.com is rebuilding. The post is live when that build finishes."

  indexnow:
    needs: deploy
    if: needs.deploy.outputs.rebuilt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tell IndexNow about new and refreshed posts
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/indexnow.mjs
